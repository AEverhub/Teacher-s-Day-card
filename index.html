<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師節留言板</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #238636;
      --danger-color: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* 淡入與浮現動畫 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      animation: fadeInUp 0.4s ease-out;
    }

    .stats-panel {
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item h3 {
      margin: 0;
      font-size: 1.5rem;
      color: #58a6ff;
    }

    .stat-item p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #8b949e;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      background-color: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    /* 留言卡片動畫 */
    .comment-card {
      border-bottom: 1px solid var(--border-color);
      padding: 12px 0;
      animation: fadeInUp 0.3s ease-out;
    }

    .comment-card:last-child {
      border-bottom: none;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .author {
      font-weight: bold;
    }

    .ip-tag {
      font-size: 0.8rem;
      color: #8b949e;
      margin-left: 4px;
      font-weight: normal;
    }

    .content {
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .del-btn {
      color: #ff7b72;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
      width: auto;
    }

    .reset-btn {
      background-color: var(--danger-color);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- 數據統計面板 -->
  <div class="card stats-panel">
    <div class="stat-item">
      <h3 id="viewCount">0</h3>
      <p>總瀏覽人次</p>
    </div>
    <div class="stat-item">
      <h3 id="commentCount">0</h3>
      <p>留言總數</p>
    </div>
  </div>
  
  <div id="adminPanelArea"></div>

  <!-- 輸入留言表單 -->
  <div class="card">
    <h3>新增留言</h3>
    <div class="form-group">
      <label for="userName">名字</label>
      <input type="text" id="userName" placeholder="請輸入名字或指令...">
    </div>
    <div class="form-group">
      <label for="userMsg">內容</label>
      <textarea id="userMsg" rows="3" placeholder="請輸入留言內容或指令..."></textarea>
    </div>
    <button id="sendBtn">發送留言</button>
  </div>

  <!-- 留言列表展示 -->
  <div class="card">
    <h3>留言牆</h3>
    <div id="commentList">載入中...</div>
  </div>

  <!-- Firebase SDK (v12.19.0) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, remove, runTransaction } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    // 1. 請在此填入你的 Firebase 金鑰
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let isAdminMode = false;
    let cachedCommentsData = null;

    const userNameInput = document.getElementById('userName');
    const userMsgInput = document.getElementById('userMsg');
    const sendBtn = document.getElementById('sendBtn');
    const commentListEl = document.getElementById('commentList');
    const viewCountEl = document.getElementById('viewCount');
    const commentCountEl = document.getElementById('commentCount');
    const adminPanelArea = document.getElementById('adminPanelArea');

    // 暗號對照與管理員模式解鎖
    function checkAdminCommand(value) {
      if (value.trim() === '/adminmod990420_&-') {
        if (!isAdminMode) {
          isAdminMode = true;
          alert('🔓 已成功解鎖管理員模式！');
          renderAdminUI();
          if (cachedCommentsData) renderComments(cachedCommentsData);
        }
        return true;
      }
      return false;
    }

    [userNameInput, userMsgInput].forEach(input => {
      input?.addEventListener('input', (e) => {
        if (checkAdminCommand(e.target.value)) {
          e.target.value = '';
        }
      });
    });

    function renderAdminUI() {
      if (isAdminMode && !document.getElementById('resetStatsBtn')) {
        const adminCard = document.createElement('div');
        adminCard.className = 'card';
        adminCard.innerHTML = `<button id="resetStatsBtn" class="reset-btn">🧹 重置數據面板 (瀏覽次數歸零)</button>`;
        adminPanelArea.appendChild(adminCard);
        document.getElementById('resetStatsBtn').onclick = resetPortalStats;
      }
    }

    // 取得 IP
    async function getUserIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
      } catch (err) {
        return '未知 IP';
      }
    }

    // 瀏覽計數
    const viewsRef = ref(db, 'portal_stats/unique_views');
    runTransaction(viewsRef, (currentViews) => (currentViews || 0) + 1);
    onValue(viewsRef, (snapshot) => {
      viewCountEl.textContent = snapshot.val() || 0;
    });

    // 留言監聽與渲染
    const commentsRef = ref(db, 'teacher_day_comments');
    onValue(commentsRef, (snapshot) => {
      cachedCommentsData = snapshot.val();
      renderComments(cachedCommentsData);
    });

    function renderComments(data) {
      commentListEl.innerHTML = '';
      if (!data) {
        commentCountEl.textContent = '0';
        commentListEl.textContent = '目前尚無留言';
        return;
      }

      const entries = Object.entries(data);
      commentCountEl.textContent = entries.length;

      entries.reverse().forEach(([key, item]) => {
        const safeName = document.createTextNode(item.name || '無名氏').textContent;
        const safeMsg = document.createTextNode(item.message || '').textContent;
        const safeIp = document.createTextNode(item.ip || '未知 IP').textContent;

        const card = document.createElement('div');
        card.className = 'comment-card';

        const delButtonHTML = isAdminMode 
          ? `<button class="del-btn" onclick="deleteComment('${key}')">[刪除]</button>` 
          : '';

        card.innerHTML = `
          <div class="comment-header">
            <div class="author">
              ${safeName} <span class="ip-tag">(${safeIp})</span>
            </div>
            ${delButtonHTML}
          </div>
          <div class="content">${safeMsg}</div>
        `;

        commentListEl.appendChild(card);
      });
    }

    // 發送留言
    sendBtn.addEventListener('click', async () => {
      const name = userNameInput.value.trim();
      const message = userMsgInput.value.trim();

      if (!name || !message) {
        alert('請填寫名字與內容！');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = '發送中...';

      const userIp = await getUserIP();

      push(commentsRef, {
        name: name,
        message: message,
        ip: userIp,
        timestamp: Date.now()
      }).then(() => {
        userNameInput.value = '';
        userMsgInput.value = '';
      }).catch((err) => {
        alert('發送失敗: ' + err.message);
      }).finally(() => {
        sendBtn.disabled = false;
        sendBtn.textContent = '發送留言';
      });
    });

    // 管理員刪除單筆
    window.deleteComment = function(key) {
      if (!isAdminMode) return;
      if (confirm('確定要刪除這條留言嗎？')) {
        remove(ref(db, `teacher_day_comments/${key}`)).catch(err => alert('刪除失敗: ' + err.message));
      }
    };

    // 管理員重置
    function resetPortalStats() {
      if (!isAdminMode) return;
      if (confirm('確定要將瀏覽人數歸零嗎？')) {
        set(viewsRef, 0).then(() => alert('數據已重置！')).catch(err => alert('重置失敗: ' + err.message));
      }
    }
  </script>
</body>
</html>
