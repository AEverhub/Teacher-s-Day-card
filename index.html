<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>教師節解鎖卡片 | Teachers' Day Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050508;
            color: #fff;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 15px;
        }

        html {
            height: -webkit-fill-available;
        }

        /* 畫布：代碼瀑布與電流效果 */
        #effectsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 第一階段：入場按鈕區 --- */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 320px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .intro-container.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        .start-btn {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.08);
            border: 2px solid #00f3ff;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 10px #00f3ff;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .start-btn:active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 35px #00f3ff;
            transform: scale(0.96);
        }

        .btn-subtext {
            margin-top: 15px;
            color: #a0a0a0;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* 全螢幕閃光脈衝 */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        .flash-active {
            opacity: 0.95;
        }

        /* --- 第二階段：主卡片區 --- */
        .card-container {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 420px;
            opacity: 0;
            transform: translateY(40px) scale(0.92);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .card-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .glass-card {
            background: rgba(15, 15, 25, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 24px;
            padding: 28px 20px 22px 20px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* 電路掃描光線 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #00f3ff, #ff007f, transparent);
            animation: circuitScan 2.5s linear infinite;
        }

        @keyframes circuitScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 語系切換按鈕 */
        .lang-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 2px;
            z-index: 30;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #888;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        .card-title {
            font-size: 1.4rem;
            color: #00f3ff;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            letter-spacing: 1px;
        }

        .card-body {
            font-size: 0.98rem;
            line-height: 1.75;
            color: #e0e0e0;
            margin-bottom: 25px;
            min-height: 150px;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 15px;
        }

        .signature {
            color: #ff007f;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
        }

        .date-tag {
            color: #8a8a8a;
            font-size: 0.8rem;
        }

        /* 脈衝發光心形 */
        .core-heart {
            display: block;
            margin: 5px auto 15px auto;
            width: 45px;
            height: 45px;
            background: #ff007f;
            transform: rotate(-45deg);
            position: relative;
            animation: heartBeat 1.2s infinite ease-in-out;
            box-shadow: 0 0 15px #ff007f;
        }

        .core-heart::before, .core-heart::after {
            content: "";
            width: 45px;
            height: 45px;
            background: #ff007f;
            border-radius: 50%;
            position: absolute;
        }
        .core-heart::before { top: -22.5px; left: 0; }
        .core-heart::after { left: 22.5px; top: 0; }

        @keyframes heartBeat {
            0%, 100% { transform: rotate(-45deg) scale(0.9); box-shadow: 0 0 15px #ff007f; }
            50% { transform: rotate(-45deg) scale(1.1); box-shadow: 0 0 30px #ff007f, 0 0 45px #00f3ff; }
        }

        /* 畫面震撼抖動 */
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 8px); }
            50% { transform: translate(8px, -8px); }
            75% { transform: translate(-4px, 4px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>
    <div class="flash-overlay" id="flash"></div>

    <!-- 第一階段：入場按鈕 -->
    <div class="intro-container" id="intro">
        <button class="start-btn" onclick="startExperience()">
            <span>⚡ 啟動教師節卡片</span>
        </button>
        <div class="btn-subtext">[ 點擊解鎖電流與專屬訊息 ]</div>
    </div>

    <!-- 第二階段：卡片主體 -->
    <div class="card-container" id="cardContainer">
        <div class="glass-card">
            <!-- 語系切換按鈕 -->
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-zh" onclick="switchLanguage('zh')">中</button>
                <button class="lang-btn" id="btn-en" onclick="switchLanguage('en')">EN</button>
            </div>

            <div class="core-heart"></div>
            <h1 class="card-title" id="cardTitle">&lt; Happy Teachers' Day /&gt;</h1>
            
            <div class="card-body" id="typewriter"></div>

            <div class="card-footer">
                <div class="date-tag">09.28 / Teachers' Day</div>
                <div class="signature" id="signatureText">學生 張永旭 敬上 💻</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix 雨滴效果
        const chars = '01010101ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]=/+*#@!';
        const fontSize = 12;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(0);
        
        // 閃電電流效果
        let bolts = [];
        let isIntensityMode = false;

        function drawEffects() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                if (Math.random() > 0.88) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = isIntensityMode ? '#00f3ff' : '#003344';
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            if (isIntensityMode) {
                for (let i = bolts.length - 1; i >= 0; i--) {
                    bolts[i].draw();
                    bolts[i].update();
                    if (bolts[i].life <= 0) bolts.splice(i, 1);
                }

                if (Math.random() < 0.7) {
                    bolts.push(new Lightning());
                }
            }

            requestAnimationFrame(drawEffects);
        }

        class Lightning {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.path = [{x: this.x, y: this.y}];
                this.life = 8;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff007f';
                this.generatePath();
            }

            generatePath() {
                let curX = this.x;
                let curY = this.y;
                while (curY < canvas.height) {
                    curX += (Math.random() - 0.5) * 50;
                    curY += Math.random() * 30 + 10;
                    this.path.push({x: curX, y: curY});
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = Math.random() * 2.5 + 1;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                for (let i = 0; i < this.path.length - 1; i++) {
                    ctx.moveTo(this.path[i].x, this.path[i].y);
                    ctx.lineTo(this.path[i+1].x, this.path[i+1].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            update() {
                this.life--;
            }
        }

        drawEffects();

        // --- 中英文語系資料 ---
        const messages = {
            zh: {
                title: "&lt; 教師節快樂 /&gt;",
                text: "親愛的老師：\n\n感謝您就像強大的核心邏輯與演算法，帶領我們在知識與技術的領域中除錯、升級與成長。\n\n祝您教師節快樂！程式運算永遠零 Bug，每天都有滿滿的成就感與好心情！✨",
                signature: "學生 張永旭 敬上 💻"
            },
            en: {
                title: "&lt; Happy Teachers' Day /&gt;",
                text: "Dear Teacher,\n\nThank you for guiding us like a powerful core algorithm—helping us debug, upgrade, and grow through our learning journey.\n\nWishing you a Happy Teachers' Day! May your code run bug-free and your days be full of joy! ✨",
                signature: "Sincerely, Yong-Xu Zhang 💻"
            }
        };

        let currentLang = 'zh';
        let typewriterTimeout;

        function typeWriter(text, elementId, speed = 40) {
            clearTimeout(typewriterTimeout);
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';

            function type() {
                if (i < text.length) {
                    const char = text.charAt(i);
                    elem.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                }
            }
            type();
        }

        // 切換中英文
        function switchLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.getElementById('cardTitle').innerHTML = messages[lang].title;
            document.getElementById('signatureText').innerText = messages[lang].signature;

            typeWriter(messages[lang].text, 'typewriter', 35);
        }

        // 啟動體驗
        function startExperience() {
            const intro = document.getElementById('intro');
            const flash = document.getElementById('flash');
            const cardContainer = document.getElementById('cardContainer');

            intro.classList.add('hidden');

            isIntensityMode = true;
            document.body.classList.add('shake');

            setTimeout(() => {
                flash.classList.add('flash-active');
            }, 250);

            setTimeout(() => {
                flash.classList.remove('flash-active');
            }, 450);

            setTimeout(() => {
                document.body.classList.remove('shake');
                cardContainer.classList.add('visible');
                typeWriter(messages[currentLang].text, 'typewriter', 40);
            }, 750);
        }
    </script>
</body>
</html>
