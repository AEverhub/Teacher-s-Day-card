<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 精密邏輯電路板 LCD 教師節卡片</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Courier New', 'PingFang TC', 'Microsoft JhengHei', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030607;
            color: #fff;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        html {
            height: -webkit-fill-available;
        }

        /* 背景公式 Canvas */
        #effectsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 第一階段：神秘感入場區 --- */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 320px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .intro-container.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .start-btn {
            width: 100%;
            padding: 20px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffaa;
            background: rgba(0, 255, 170, 0.08);
            border: 2px solid #00ffaa;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.35), inset 0 0 15px rgba(0, 255, 170, 0.15);
            text-shadow: 0 0 10px #00ffaa;
            transition: all 0.2s ease;
            outline: none;
            letter-spacing: 2px;
        }

        .start-btn:active {
            background: #00ffaa;
            color: #051a0e;
            box-shadow: 0 0 35px #00ffaa;
            transform: scale(0.96);
        }

        .audio-warning {
            margin-top: 20px;
            color: #ff3344;
            font-size: 0.88rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 51, 68, 0.6);
            animation: warningPulse 1.5s infinite ease-in-out;
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* --- 第二階段：3D PCB 電路板與 LCD 模組 --- */
        .card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            z-index: 20;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: rotateX(15deg) translateY(30px) scale(0.85);
            transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .card-container.visible {
            opacity: 1;
            transform: rotateX(10deg) translateY(0) scale(1);
            pointer-events: auto;
        }

        /* LCD 放大置中效果 */
        .card-container.zoom-lcd {
            transform: rotateX(0deg) translateY(0) scale(1.12);
        }

        /* 3D 深綠色精密主電路板 (Main PCB) */
        .pcb-board {
            width: 100%;
            height: 100%;
            max-width: 680px;
            background: #072213;
            background-image: 
                radial-gradient(#103b22 15%, transparent 16%),
                radial-gradient(#103b22 15%, transparent 16%);
            background-size: 18px 18px;
            background-position: 0 0, 9px 9px;
            border: 4px solid #144e2b;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 255, 170, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transform-style: preserve-3d;
        }

        /* 頂部更大塊的母板區塊 (Main Logic Board Zone) */
        .top-circuit-zone {
            width: 100%;
            height: 100px;
            background: rgba(5, 26, 14, 0.8);
            border: 2px dashed #1b5e35;
            border-radius: 10px;
            position: relative;
            padding: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 22;
        }

        /* 元件：SMD 電阻與電容 (Resistors & Capacitors) */
        .smd-component {
            width: 32px;
            height: 16px;
            background: #333;
            border-left: 6px solid #aaa;
            border-right: 6px solid #aaa;
            border-radius: 2px;
            position: relative;
            font-size: 0.55rem;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }

        .smd-capacitor {
            width: 18px;
            height: 24px;
            background: #b87333;
            border-top: 3px solid #ddd;
            border-bottom: 3px solid #111;
            border-radius: 3px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }

        /* 元件：TTL / CMOS IC 晶片 (含邏輯閘符號) */
        .ic-chip {
            width: 110px;
            height: 55px;
            background: #151515;
            border: 1px solid #444;
            border-radius: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.8);
        }

        .ic-chip::before {
            content: '';
            position: absolute;
            left: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 12px;
            background: #000;
            border-radius: 0 6px 6px 0;
        }

        .ic-label {
            position: absolute;
            top: 2px;
            font-size: 0.55rem;
            color: #888;
            letter-spacing: 0.5px;
        }

        /* 邏輯閘 SVG 符號 */
        .gate-symbol {
            width: 45px;
            height: 25px;
            stroke: #d4af37;
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.3s ease, filter 0.3s ease;
        }

        .ic-chip.active .gate-symbol {
            stroke: #00ffaa;
            filter: drop-shadow(0 0 4px #00ffaa);
        }

        /* 精密銅線走線 (Copper Traces) */
        .pcb-trace {
            position: absolute;
            background: rgba(212, 175, 55, 0.25);
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 21;
        }

        .trace-power-to-res { top: 30px; left: 15px; width: 45px; height: 3px; }
        .trace-res-to-ic { top: 30px; left: 100px; width: 80px; height: 3px; }
        .trace-ic-to-lcd { top: 110px; left: 50%; width: 3px; height: 35px; transform: translateX(-50%); }

        /* 電流通過與亮燈動畫 */
        .pcb-trace.active {
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa, 0 0 18px #00ffaa;
        }

        /* LCD 針腳接頭 (Pin Header 1~16) */
        .lcd-pin-header {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 6px 0;
            z-index: 25;
        }

        .pin-dot {
            width: 8px;
            height: 8px;
            background: #8d7322;
            border-radius: 50%;
            border: 1px solid #000;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .pin-dot.powered {
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* 左下角微動開關 (Tactile Switch) */
        .tactile-switch-wrap {
            position: absolute;
            bottom: 18px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 40;
            cursor: pointer;
        }

        .tactile-btn {
            width: 36px;
            height: 36px;
            background: #222;
            border: 2px solid #555;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 0 #111, 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tactile-btn::after {
            content: '';
            width: 18px;
            height: 18px;
            background: #ff3344;
            border-radius: 50%;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
        }

        .tactile-switch-wrap:active .tactile-btn, .tactile-btn.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #111;
        }

        .switch-hint {
            font-size: 0.72rem;
            color: #00ffaa;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulseHint 1s infinite alternate;
        }

        @keyframes pulseHint {
            0% { opacity: 0.4; }
            100% { opacity: 1; text-shadow: 0 0 8px #00ffaa; }
        }

        /* 頂部控制列 */
        .pcb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 6px;
            z-index: 30;
        }

        .sys-status {
            font-size: 0.68rem;
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-btn, .lang-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffaa;
            border-radius: 6px;
            padding: 2px;
        }

        .lang-btn {
            border: none;
            background: none;
            color: #447755;
        }

        .lang-btn.active {
            background: #00ffaa;
            color: #051a0e;
        }

        /* LCD 模組螢幕面板 (LCD1602 Green Backlight) */
        .lcd-screen-frame {
            flex: 1;
            background: #0d1a0e;
            border: 3px solid #000;
            border-radius: 8px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 255, 170, 0.25);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            margin: 4px 0;
            transition: all 0.5s ease;
            transform-style: preserve-3d;
        }

        .lcd-display {
            width: 100%;
            height: 100%;
            background: #6b8e11;
            color: #0a1c00;
            border-radius: 4px;
            padding: 12px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .lcd-display::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .lcd-display::-webkit-scrollbar {
            width: 4px;
        }
        .lcd-display::-webkit-scrollbar-thumb {
            background: #41570a;
            border-radius: 2px;
        }

        .lcd-header-text {
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px dashed #41570a;
            padding-bottom: 6px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .lcd-body-text {
            font-size: 0.92rem;
            line-height: 1.7;
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .pcb-footer {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding-top: 4px;
            z-index: 30;
            min-height: 24px;
        }

        .signature {
            color: #d4af37;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: right;
            line-height: 1.3;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .signature.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>

    <!-- 第一階段：神秘感入場 -->
    <div class="intro-container" id="intro">
        <button class="start-btn" onclick="startEnergizeSequence()">點擊此處</button>
        <div class="audio-warning">請開啟聲音</div>
    </div>

    <!-- 第二階段：3D PCB 電路板與 LCD 顯示螢幕 -->
    <div class="card-container" id="cardContainer">
        <div class="pcb-board">
            <!-- 導線 -->
            <div class="pcb-trace trace-power-to-res" id="tr1"></div>
            <div class="pcb-trace trace-res-to-ic" id="tr2"></div>
            <div class="pcb-trace trace-ic-to-lcd" id="trLcd"></div>

            <!-- PCB 頂部列 -->
            <div class="pcb-header">
                <div class="sys-status" id="sysStatus">SYS: POWERING...</div>
                <div class="controls-group">
                    <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 語音</button>
                    <div class="lang-switch">
                        <button class="lang-btn active" id="btn-zh" onclick="manualSwitchLanguage('zh')">中</button>
                        <button class="lang-btn" id="btn-en" onclick="manualSwitchLanguage('en')">EN</button>
                    </div>
                </div>
            </div>

            <!-- 母電路板區域 (TTL/CMOS IC + 貼片元件) -->
            <div class="top-circuit-zone">
                <div class="smd-component">10kΩ</div>
                <div class="smd-capacitor"></div>
                
                <!-- TTL 邏輯 IC 晶片 (內含 NAND/OR 閘極符號) -->
                <div class="ic-chip" id="icChip">
                    <span class="ic-label">74HC00 TTL</span>
                    <svg class="gate-symbol" viewBox="0 0 50 30">
                        <!-- NAND 邏輯閘符號 -->
                        <path d="M 5 5 L 20 5 C 32 5, 32 25, 20 25 L 5 25 Z" />
                        <circle cx="36" cy="15" r="3" />
                        <line x1="0" y1="10" x2="5" y2="10" />
                        <line x1="0" y1="20" x2="5" y2="20" />
                        <line x1="39" y1="15" x2="48" y2="15" />
                    </svg>
                </div>

                <div class="smd-component">0.1µF</div>
            </div>

            <!-- LCD 16 Pin 針腳接頭 -->
            <div class="lcd-pin-header" id="pinHeader">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <!-- LCD 模組螢幕 -->
            <div class="lcd-screen-frame" id="lcdFrame">
                <div class="lcd-display">
                    <div class="lcd-header-text" id="cardTitle">SYSTEM INITIALIZING...</div>
                    <div class="lcd-body-text" id="typewriter"></div>
                </div>
            </div>

            <!-- 左下角微動開關 -->
            <div class="tactile-switch-wrap" id="switchWrap" onclick="triggerCardUnlock()">
                <div class="tactile-btn" id="tactileBtn"></div>
                <div class="switch-hint" id="switchHint">← 按下開關解鎖卡片</div>
            </div>

            <!-- 頁尾 (學生簽名檔：文本播完後顯示) -->
            <div class="pcb-footer">
                <div class="signature" id="signatureText">學生 張永旭 敬上 💻</div>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio API 聲效合成器 ---
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        function playRelayAndCurrentSound() {
            if (!audioCtx || isMuted) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playButtonClickSound() {
            if (!audioCtx || isMuted) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // --- Web Speech API 語音朗讀引擎 ---
        const synth = window.speechSynthesis;

        function speakSequence() {
            if (!('speechSynthesis' in window)) return;
            synth.cancel();

            if (isMuted) return;

            const zhText = "老師祝您教師節快樂！親愛的老師：感謝您像點亮心智的催化劑與恆定的能量源，以無私的耐性為我們化解學習中的疑難。不論是嚴謹的邏輯思維、深刻的知識傳承，或是溫暖的春風化雨，您都引導我們找到專屬的方向與共鳴。祝您教師節快樂！桃李滿天下，事事順心、喜樂安康！學生張永旭敬上。";
            const zhUtterance = new SpeechSynthesisUtterance(zhText);
            zhUtterance.lang = 'zh-TW';
            zhUtterance.rate = 0.95;

            const enText = "Dear Teacher, Happy Teachers' Day! Thank you for being a constant source of wisdom and inspiration. Like a vital catalyst and steady guidance, you bring clarity to complex knowledge and help us discover our potential. We truly appreciate your patience, dedication, and warmth. Wishing you a wonderful Teachers' Day, excellent health, and continued happiness every day! Student Yong-Xu Zhang.";
            const enUtterance = new SpeechSynthesisUtterance(enText);
            enUtterance.lang = 'en-US';
            enUtterance.rate = 0.95;

            zhUtterance.onend = function () {
                if (isMuted) return;
                switchLanguage('en');
                synth.speak(enUtterance);
            };

            synth.speak(zhUtterance);
        }

        function toggleAudio() {
            isMuted = !isMuted;
            const btn = document.getElementById('audioToggleBtn');
            btn.innerHTML = isMuted ? '🔇 靜音' : '🔊 語音';
            btn.style.color = isMuted ? '#888' : '#00ffaa';

            if (isMuted) {
                synth.cancel();
            } else {
                if (isUnlocked) {
                    if (currentLang === 'zh') {
                        speakSequence();
                    } else {
                        const enText = "Dear Teacher, Happy Teachers' Day! Thank you for being a constant source of wisdom and inspiration. Wishing you happiness every day!";
                        const enUtterance = new SpeechSynthesisUtterance(enText);
                        enUtterance.lang = 'en-US';
                        synth.speak(enUtterance);
                    }
                }
            }
        }

        // --- Canvas 專用背景 ---
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let timeStep = 0;

        function drawMathAndElectronicsGraphics() {
            timeStep += 0.02;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            ctx.strokeStyle = 'rgba(0, 255, 170, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 45;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            ctx.lineWidth = 1.6;
            let waveYCenter = 85;

            ctx.strokeStyle = 'rgba(0, 255, 170, 0.3)';
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 4) {
                let vY = Math.sin(x * 0.012 + timeStep * 2) * 25 + waveYCenter;
                if (x === 0) ctx.moveTo(x, vY);
                else ctx.lineTo(x, vY);
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(0, 255, 170, 0.45)';
            ctx.font = '11px monospace';
            ctx.fillText(`f(x) = A·sin(ωt + φ)`, 15, 25);
            ctx.fillText(`E = m·c²  |  V = I·R`, 15, 40);
            ctx.fillText(`KVL: ∑V = 0  |  KCL: ∑I = 0`, 15, 55);

            ctx.restore();
            requestAnimationFrame(drawMathAndElectronicsGraphics);
        }

        drawMathAndElectronicsGraphics();

        // --- 卡片內容設定 ---
        const messages = {
            zh: {
                title: "> LCD1602: TEACHER'S DAY <",
                text: "親愛的老師：\n\n「程門立雪」感念師恩，「春風化雨」潤物無聲。\n\n感謝您像點亮心智的「催化劑」與恆定的「能量源」，以無比的耐性為我們化解學習與成長中的疑難。\n\n不論是嚴謹的邏輯思維、深刻的知識傳承，或是溫暖的關懷引導，您都帶領我們找到了專屬的方向與共鳴。\n\n祝您教師節快樂！桃李滿天下，事事順心、喜樂安康！✨",
                signature: "學生 張永旭 敬上 💻"
            },
            en: {
                title: "> LCD1602: TEACHER'S DAY <",
                text: "Dear Teacher,\n\nThank you for being a constant source of wisdom, guidance, and inspiration.\n\nLike a vital catalyst and steady illumination, you bring clarity to complex ideas and help us discover our true potential.\n\nWe deeply appreciate your unwavering dedication, patience, and warmth.\n\nWishing you a joyful Teachers' Day, great health, and happiness every day! ✨",
                signature: "Student Yong-Xu Zhang 💻"
            }
        };

        let currentLang = 'zh';
        let typewriterTimeout;
        let isUnlocked = false;

        // 打字機功能 (文本完結後才顯示學生姓名)
        function typeWriter(text, elementId, speed = 30) {
            clearTimeout(typewriterTimeout);
            let i = 0;
            const elem = document.getElementById(elementId);
            const sigElem = document.getElementById('signatureText');
            
            elem.innerHTML = '';
            sigElem.classList.remove('visible'); // 隱藏簽名

            function type() {
                if (i < text.length) {
                    const char = text.charAt(i);
                    elem.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                } else {
                    // 文本顯示結束後，讓簽名浮現出來
                    sigElem.innerHTML = messages[currentLang].signature;
                    sigElem.classList.add('visible');
                }
            }
            type();
        }

        function switchLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.getElementById('cardTitle').innerHTML = messages[lang].title;

            typeWriter(messages[lang].text, 'typewriter', 25);
        }

        function manualSwitchLanguage(lang) {
            synth.cancel();
            switchLanguage(lang);
        }

        // --- TTL/CMOS 精密通電過場動畫 ---
        function startEnergizeSequence() {
            initAudio();
            playRelayAndCurrentSound();

            document.getElementById('intro').classList.add('hidden');
            const container = document.getElementById('cardContainer');
            container.classList.add('visible');

            // 1. 母電路板通電 -> 經由貼片電阻/電容
            setTimeout(() => { document.getElementById('tr1').classList.add('active'); }, 300);
            
            // 2. 電流進入 TTL/CMOS IC 並點亮內部邏輯閘
            setTimeout(() => { 
                document.getElementById('tr2').classList.add('active');
                document.getElementById('icChip').classList.add('active');
            }, 650);

            // 3. 邏輯 IC 輸出電流前往 LCD 電路接腳
            setTimeout(() => { document.getElementById('trLcd').classList.add('active'); }, 1000);

            // 4. LCD 16 Pin 針腳依序通電
            setTimeout(() => {
                const pins = document.querySelectorAll('.pin-dot');
                pins.forEach((pin, idx) => {
                    setTimeout(() => { pin.classList.add('powered'); }, idx * 35);
                });
            }, 1300);

            // 5. 緩慢放大 LCD 螢幕至正中央
            setTimeout(() => {
                container.classList.add('zoom-lcd');
                document.getElementById('sysStatus').innerHTML = 'SYS: READY';
                document.getElementById('cardTitle').innerHTML = '> LCD1602 BUSY <';
                document.getElementById('typewriter').innerHTML = '<span style="color:#0f2c00; font-weight:bold;">> 請按下左下角微動開關以解鎖卡片...</span>';
            }, 1900);
        }

        // --- 點擊微動開關解鎖卡片 ---
        function triggerCardUnlock() {
            if (isUnlocked) return;
            isUnlocked = true;

            playButtonClickSound();
            document.getElementById('tactileBtn').classList.add('pressed');
            document.getElementById('switchHint').style.display = 'none';

            setTimeout(() => {
                document.getElementById('cardTitle').innerHTML = messages[currentLang].title;
                typeWriter(messages[currentLang].text, 'typewriter', 35);
                speakSequence();
            }, 250);
        }
    </script>
