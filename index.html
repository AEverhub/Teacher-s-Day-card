<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>精密電路板 LCD 教師節卡片</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Courier New', 'PingFang TC', 'Microsoft JhengHei', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030607;
            color: #fff;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html {
            height: -webkit-fill-available;
        }

        /* 背景公式 Canvas */
        #effectsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 第一階段：神秘感入場區 --- */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 320px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .intro-container.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .start-btn {
            width: 100%;
            padding: 20px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffaa;
            background: rgba(0, 255, 170, 0.08);
            border: 2px solid #00ffaa;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 255, 170, 0.35), inset 0 0 15px rgba(0, 255, 170, 0.15);
            text-shadow: 0 0 10px #00ffaa;
            transition: all 0.2s ease;
            outline: none;
            letter-spacing: 2px;
        }

        .start-btn:active {
            background: #00ffaa;
            color: #051a0e;
            box-shadow: 0 0 35px #00ffaa;
            transform: scale(0.96);
        }

        .audio-warning {
            margin-top: 20px;
            color: #ff3344;
            font-size: 0.88rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(255, 51, 68, 0.6);
            animation: warningPulse 1.5s infinite ease-in-out;
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* --- 第二階段：PCB 電路板與 LCD 模組 --- */
        .card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            z-index: 20;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.8s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .card-container.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 鏡頭拉近放大至 LCD 效果 */
        .card-container.zoom-lcd {
            transform: scale(1.08);
        }

        /* PCB 深綠色精密電路板 */
        .pcb-board {
            width: 100%;
            height: 100%;
            max-width: 680px;
            background: #072213;
            background-image: 
                radial-gradient(#103b22 15%, transparent 16%),
                radial-gradient(#103b22 15%, transparent 16%);
            background-size: 18px 18px;
            background-position: 0 0, 9px 9px;
            border: 4px solid #144e2b;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 255, 170, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.8s ease;
        }

        /* 精密銅線走線 (Copper Traces) */
        .pcb-trace {
            position: absolute;
            background: rgba(212, 175, 55, 0.2);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .trace-main-1 { top: 40px; left: 0; width: 120px; height: 3px; }
        .trace-main-2 { top: 40px; left: 120px; width: 3px; height: 100px; }
        .trace-lcd-in { bottom: 120px; left: 50%; width: 3px; height: 60px; transform: translateX(-50%); }

        /* 電流通過與亮燈動畫 */
        .pcb-trace.active {
            background: #00ffaa;
            box-shadow: 0 0 10px #00ffaa;
        }

        /* LCD 針腳接頭 (Pin Header 1~16) */
        .lcd-pin-header {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            z-index: 25;
        }

        .pin-dot {
            width: 8px;
            height: 8px;
            background: #8d7322;
            border-radius: 50%;
            border: 1px solid #000;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .pin-dot.powered {
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
        }

        /* 左下角微動開關 (Tactile Switch) */
        .tactile-switch-wrap {
            position: absolute;
            bottom: 18px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 40;
            cursor: pointer;
        }

        .tactile-btn {
            width: 36px;
            height: 36px;
            background: #222;
            border: 2px solid #555;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 0 #111, 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tactile-btn::after {
            content: '';
            width: 18px;
            height: 18px;
            background: #ff3344;
            border-radius: 50%;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
        }

        .tactile-switch-wrap:active .tactile-btn, .tactile-btn.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #111;
        }

        .switch-hint {
            font-size: 0.72rem;
            color: #00ffaa;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulseHint 1s infinite alternate;
        }

        @keyframes pulseHint {
            0% { opacity: 0.4; }
            100% { opacity: 1; text-shadow: 0 0 8px #00ffaa; }
        }

        /* 頂部控制列 */
        .pcb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
            z-index: 30;
        }

        .sys-status {
            font-size: 0.68rem;
            color: #d4af37;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-btn, .lang-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffaa;
            border-radius: 6px;
            padding: 2px;
        }

        .lang-btn {
            border: none;
            background: none;
            color: #447755;
        }

        .lang-btn.active {
            background: #00ffaa;
            color: #051a0e;
        }

        /* LCD 模組螢幕面板 (LCD1602 Green Backlight) */
        .lcd-screen-frame {
            flex: 1;
            background: #0d1a0e;
            border: 3px solid #000;
            border-radius: 8px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 255, 170, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            margin: 6px 0;
            transition: all 0.5s ease;
        }

        .lcd-display {
            width: 100%;
            height: 100%;
            background: #6b8e11; /* 點陣液晶綠色背光 */
            color: #0a1c00;
            border-radius: 4px;
            padding: 12px;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .lcd-display::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
        }

        .lcd-display::-webkit-scrollbar {
            width: 4px;
        }
        .lcd-display::-webkit-scrollbar-thumb {
            background: #41570a;
            border-radius: 2px;
        }

        .lcd-header-text {
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px dashed #41570a;
            padding-bottom: 6px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .lcd-body-text {
            font-size: 0.92rem;
            line-height: 1.7;
            font-weight: bold;
            word-break: break-word;
            flex: 1;
        }

        .pcb-footer {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding-top: 4px;
            z-index: 30;
        }

        .signature {
            color: #d4af37;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: right;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>

    <!-- 第一階段：神秘感入場 -->
    <div class="intro-container" id="intro">
        <button class="start-btn" onclick="startEnergizeSequence()">點擊此處</button>
        <div class="audio-warning">請開啟聲音</div>
    </div>

    <!-- 第二階段：PCB 電路板與 LCD 顯示螢幕 -->
    <div class="card-container" id="cardContainer">
        <div class="pcb-board">
            <!-- 精密導線 -->
            <div class="pcb-trace trace-main-1" id="tr1"></div>
            <div class="pcb-trace trace-main-2" id="tr2"></div>
            <div class="pcb-trace trace-lcd-in" id="trLcd"></div>

            <!-- PCB 頂部列 -->
            <div class="pcb-header">
                <div class="sys-status" id="sysStatus">SYS: POWERING...</div>
                <div class="controls-group">
                    <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">🔊 語音</button>
                    <div class="lang-switch">
                        <button class="lang-btn active" id="btn-zh" onclick="manualSwitchLanguage('zh')">中</button>
                        <button class="lang-btn" id="btn-en" onclick="manualSwitchLanguage('en')">EN</button>
                    </div>
                </div>
            </div>

            <!-- LCD 16 Pin 針腳接頭 -->
            <div class="lcd-pin-header" id="pinHeader">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <!-- LCD 模組螢幕 -->
            <div class="lcd-screen-frame" id="lcdFrame">
                <div class="lcd-display">
                    <div class="lcd-header-text" id="cardTitle">SYSTEM INITIALIZING...</div>
                    <div class="lcd-body-text" id="typewriter"></div>
                </div>
            </div>

            <!-- 左下角微動開關 -->
            <div class="tactile-switch-wrap" id="switchWrap" onclick="triggerCardUnlock()">
                <div class="tactile-btn" id="tactileBtn"></div>
                <div class="switch-hint" id="switchHint">← 按下開關解鎖卡片</div>
            </div>

            <!-- 頁尾 -->
            <div class="pcb-footer">
                <div class="signature" id="signatureText">學生 張永旭 敬上 💻</div>
            </div>
        </div>
    </div>

    <script>
        // --- Web Audio API 聲效合成器 ---
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
        }

        // 1. 繼電器閉合與電流脈動聲
        function playRelayAndCurrentSound() {
            if (!audioCtx || isMuted) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // 2. 微動開關按壓聲 (Button Click)
        function playButtonClickSound() {
            if (!audioCtx || isMuted) return;
            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);

            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }

        // --- Web Speech API 語音朗讀引擎 (中 ➔ 英 自動接續) ---
        const synth = window.speechSynthesis;

        function speakSequence() {
            if (!('speechSynthesis' in window)) return;
            synth.cancel();

            if (isMuted) return;

            // 中文朗讀內容
            const zhText = "老師祝您教師節快樂！親愛的老師：感謝您像點亮心智的催化劑與恆定的能量源，以無私的耐性為我們化解學習中的疑難。不論是嚴謹的邏輯思維、深刻的知識傳承，或是溫暖的春風化雨，您都引導我們找到專屬的方向與共鳴。祝您教師節快樂！桃李滿天下，事事順心、喜樂安康！學生張永旭敬上。";
            const zhUtterance = new SpeechSynthesisUtterance(zhText);
            zhUtterance.lang = 'zh-TW';
            zhUtterance.rate = 0.95;

            // 英文朗讀內容
            const enText = "Dear Teacher, Happy Teachers' Day! Thank you for being a constant source of wisdom and inspiration. Like a vital catalyst and steady guidance, you bring clarity to complex knowledge and help us discover our potential. We truly appreciate your patience, dedication, and warmth. Wishing you a wonderful Teachers' Day, excellent health, and continued happiness every day! Student Yong-Xu Zhang.";
            const enUtterance = new SpeechSynthesisUtterance(enText);
            enUtterance.lang = 'en-US';
            enUtterance.rate = 0.95;

            // 中文播完，自動切換英文介面並播報英文
            zhUtterance.onend = function () {
                if (isMuted) return;
                switchLanguage('en');
                synth.speak(enUtterance);
            };

            synth.speak(zhUtterance);
        }

        function toggleAudio() {
            isMuted = !isMuted;
            const btn = document.getElementById('audioToggleBtn');
            btn.innerHTML = isMuted ? '🔇 靜音' : '🔊 語音';
            btn.style.color = isMuted ? '#888' : '#00ffaa';

            if (isMuted) {
                synth.cancel();
            } else {
                if (isUnlocked) {
                    if (currentLang === 'zh') {
                        speakSequence();
                    } else {
                        const enText = "Dear Teacher, Happy Teachers' Day! Thank you for being a constant source of wisdom and inspiration. Wishing you happiness every day!";
                        const enUtterance = new SpeechSynthesisUtterance(enText);
                        enUtterance.lang = 'en-US';
                        synth.speak(enUtterance);
                    }
                }
            }
        }

        // --- Canvas 專用背景：純數學與電學公式/向量動畫 ---
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let timeStep = 0;

        function drawMathAndElectronicsGraphics() {
            timeStep += 0.02;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            // 網格背景
            ctx.strokeStyle = 'rgba(0, 255, 170, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 45;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 正弦與餘弦動態波形
            ctx.lineWidth = 1.6;
            let waveYCenter = 85;

            ctx.strokeStyle = 'rgba(0, 255, 170, 0.3)';
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 4) {
                let vY = Math.sin(x * 0.012 + timeStep * 2) * 25 + waveYCenter;
                if (x === 0) ctx.moveTo(x, vY);
                else ctx.lineTo(x, vY);
            }
            ctx.stroke();

            // 極座標阻抗相位圖
            let phasorX = 70;
            let phasorY = canvas.height - 85;
            let phasorRadius = 30;

            ctx.strokeStyle = 'rgba(0, 255, 170, 0.2)';
            ctx.beginPath();
            ctx.arc(phasorX, phasorY, phasorRadius, 0, Math.PI * 2);
            ctx.stroke();

            let angle = timeStep * 1.5;
            let vecX = phasorX + phasorRadius * Math.cos(angle);
            let vecY = phasorY - phasorRadius * Math.sin(angle);
            ctx.strokeStyle = '#00ffaa';
            ctx.beginPath();
            ctx.moveTo(phasorX, phasorY);
            ctx.lineTo(vecX, vecY);
            ctx.stroke();

            // 動態公式文字標記
            ctx.fillStyle = 'rgba(0, 255, 170, 0.45)';
            ctx.font = '11px monospace';
            ctx.fillText(`f(x) = A·sin(ωt + φ)`, 15, 25);
            ctx.fillText(`E = m·c²  |  V = I·R`, 15, 40);
            ctx.fillText(`KVL: ∑V = 0  |  KCL: ∑I = 0`, 15, 55);

            ctx.restore();
            requestAnimationFrame(drawMathAndElectronicsGraphics);
        }

        drawMathAndElectronicsGraphics();

        // --- 通用科目卡片內文設定 ---
        const messages = {
            zh: {
                title: "> LCD1602: TEACHER'S DAY <",
                text: "親愛的老師：\n\n「程門立雪」感念師恩，「春風化雨」潤物無聲。\n\n感謝您像點亮心智的「催化劑」與恆定的「能量源」，以無比的耐性為我們化解學習與成長中的疑難。\n\n不論是嚴謹的邏輯思維、深刻的知識傳承，或是溫暖的關懷引導，您都帶領我們找到了專屬的方向與共鳴。\n\n祝您教師節快樂！桃李滿天下，事事順心、喜樂安康！✨",
                signature: "學生 張永旭 敬上 💻"
            },
            en: {
                title: "> LCD1602: TEACHER'S DAY <",
                text: "Dear Teacher,\n\nThank you for being a constant source of wisdom, guidance, and inspiration.\n\nLike a vital catalyst and steady illumination, you bring clarity to complex ideas and help us discover our true potential.\n\nWe deeply appreciate your unwavering dedication, patience, and warmth.\n\nWishing you a joyful Teachers' Day, great health, and happiness every day! ✨",
                signature: "Student Yong-Xu Zhang 💻"
            }
        };

        let currentLang = 'zh';
        let typewriterTimeout;
        let isUnlocked = false;

        function typeWriter(text, elementId, speed = 30) {
            clearTimeout(typewriterTimeout);
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';

            function type() {
                if (i < text.length) {
                    const char = text.charAt(i);
                    elem.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                }
            }
            type();
        }

        function switchLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.getElementById('cardTitle').innerHTML = messages[lang].title;
            document.getElementById('signatureText').innerHTML = messages[lang].signature;

            typeWriter(messages[lang].text, 'typewriter', 25);
        }

        function manualSwitchLanguage(lang) {
            synth.cancel();
            switchLanguage(lang);
        }

        // --- 電流導通動畫序列 ---
        function startEnergizeSequence() {
            initAudio();
            playRelayAndCurrentSound();

            document.getElementById('intro').classList.add('hidden');
            const container = document.getElementById('cardContainer');
            container.classList.add('visible');

            // 1. 銅線流動動畫
            setTimeout(() => { document.getElementById('tr1').classList.add('active'); }, 300);
            setTimeout(() => { document.getElementById('tr2').classList.add('active'); }, 600);
            setTimeout(() => { document.getElementById('trLcd').classList.add('active'); }, 900);

            // 2. LCD 針腳依序通電亮燈
            setTimeout(() => {
                const pins = document.querySelectorAll('.pin-dot');
                pins.forEach((pin, idx) => {
                    setTimeout(() => { pin.classList.add('powered'); }, idx * 40);
                });
            }, 1200);

            // 3. LCD 鏡頭拉近放大與提示點擊開關
            setTimeout(() => {
                container.classList.add('zoom-lcd');
                document.getElementById('sysStatus').innerHTML = 'SYS: READY';
                document.getElementById('cardTitle').innerHTML = '> LCD1602 BUSY <';
                document.getElementById('typewriter').innerHTML = '<span style="color:#0f2c00; font-weight:bold;">> 請按下左下角微動開關以解鎖卡片...</span>';
            }, 1800);
        }

        // --- 點擊微動開關解鎖卡片 ---
        function triggerCardUnlock() {
            if (isUnlocked) return;
            isUnlocked = true;

            playButtonClickSound();
            document.getElementById('tactileBtn').classList.add('pressed');
            document.getElementById('switchHint').style.display = 'none';

            setTimeout(() => {
                document.getElementById('cardTitle').innerHTML = messages[currentLang].title;
                typeWriter(messages[currentLang].text, 'typewriter', 35);
                speakSequence();
            }, 250);
        }
    </script>
</body>
</html>
