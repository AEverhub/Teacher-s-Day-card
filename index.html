<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>教師節解鎖卡片 | Teachers' Day Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Consolas', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050508;
            color: #fff;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        html {
            height: -webkit-fill-available;
        }

        /* 畫布：代碼瀑布、數學圖形與電流效果 */
        #effectsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- 第一階段：入場按鈕區 --- */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 85%;
            max-width: 320px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .intro-container.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        .start-btn {
            width: 100%;
            padding: 18px 25px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.08);
            border: 2px solid #00f3ff;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 10px #00f3ff;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .start-btn:active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 35px #00f3ff;
            transform: scale(0.96);
        }

        .btn-subtext {
            margin-top: 15px;
            color: #a0a0a0;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* 全螢幕閃光脈衝 */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        .flash-active {
            opacity: 0.95;
        }

        /* --- 第二階段：滿版卡片區 --- */
        .card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            z-index: 20;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .card-container.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .glass-card {
            width: 100%;
            height: 100%;
            max-width: 600px; /* 電腦端優化極限寬度 */
            background: rgba(12, 12, 22, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 243, 255, 0.35);
            border-radius: 20px;
            padding: 20px 20px 18px 20px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 電路掃描光線 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #00f3ff, #ff007f, transparent);
            animation: circuitScan 2.5s linear infinite;
        }

        @keyframes circuitScan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 頂部控制列（避免按鈕與心型重疊） */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
            position: relative;
            z-index: 30;
        }

        .header-title-tag {
            font-size: 0.75rem;
            color: #00f3ff;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* 語系切換按鈕 */
        .lang-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 2px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #888;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        /* 內容核心區域 */
        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            margin: 10px 0;
            padding-right: 4px;
        }

        /* 自訂內建滾動條 */
        .card-content::-webkit-scrollbar {
            width: 4px;
        }
        .card-content::-webkit-scrollbar-thumb {
            background: rgba(0, 243, 255, 0.3);
            border-radius: 4px;
        }

        .card-title {
            font-size: 1.35rem;
            color: #00f3ff;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 18px;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
            letter-spacing: 1px;
        }

        .card-body {
            font-size: 0.98rem;
            line-height: 1.85;
            color: #e0e0e0;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding-top: 12px;
            margin-top: 5px;
        }

        .signature {
            color: #ff007f;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5);
            text-align: right;
            line-height: 1.4;
        }

        .date-tag {
            color: #8a8a8a;
            font-size: 0.78rem;
        }

        /* 脈衝發光心形 */
        .core-heart {
            display: block;
            margin: 5px auto 10px auto;
            width: 38px;
            height: 38px;
            background: #ff007f;
            transform: rotate(-45deg);
            position: relative;
            animation: heartBeat 1.2s infinite ease-in-out;
            box-shadow: 0 0 15px #ff007f;
            flex-shrink: 0;
        }

        .core-heart::before, .core-heart::after {
            content: "";
            width: 38px;
            height: 38px;
            background: #ff007f;
            border-radius: 50%;
            position: absolute;
        }
        .core-heart::before { top: -19px; left: 0; }
        .core-heart::after { left: 19px; top: 0; }

        @keyframes heartBeat {
            0%, 100% { transform: rotate(-45deg) scale(0.9); box-shadow: 0 0 15px #ff007f; }
            50% { transform: rotate(-45deg) scale(1.1); box-shadow: 0 0 30px #ff007f, 0 0 45px #00f3ff; }
        }

        /* 畫面震撼抖動 */
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 8px); }
            50% { transform: translate(8px, -8px); }
            75% { transform: translate(-4px, 4px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <canvas id="effectsCanvas"></canvas>
    <div class="flash-overlay" id="flash"></div>

    <!-- 第一階段：入場按鈕 -->
    <div class="intro-container" id="intro">
        <button class="start-btn" onclick="startExperience()">
            <span>⚡ 啟動教師節卡片</span>
        </button>
        <div class="btn-subtext">[ 點擊解鎖電流與專屬訊息 ]</div>
    </div>

    <!-- 第二階段：滿版卡片主體 -->
    <div class="card-container" id="cardContainer">
        <div class="glass-card">
            <!-- 頂部列：狀態與語系切換 -->
            <div class="card-header">
                <div class="header-title-tag">SYS.CARD // VER 2.0</div>
                <div class="lang-switch">
                    <button class="lang-btn active" id="btn-zh" onclick="switchLanguage('zh')">中</button>
                    <button class="lang-btn" id="btn-en" onclick="switchLanguage('en')">EN</button>
                </div>
            </div>

            <!-- 可滾動內容區 -->
            <div class="card-content">
                <div class="core-heart"></div>
                <h1 class="card-title" id="cardTitle">&lt; 桃李芬芳．尊師重道 /&gt;</h1>
                <div class="card-body" id="typewriter"></div>
            </div>

            <!-- 頁尾署名區 -->
            <div class="card-footer">
                <div class="date-tag">09.28 / Teachers' Day</div>
                <div class="signature" id="signatureText">電子科二年乙班<br>學生 張永旭 敬上 💻</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix 雨滴效果
        const chars = '01010101ABCDEFGHIJKLMNOPQRSTUVWXYZ<>{}[]=/+*#@!';
        const fontSize = 12;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(0);
        
        // 閃電電流與數學幾何變數
        let bolts = [];
        let isIntensityMode = false;
        let timeStep = 0;

        // --- 數學幾何動畫繪製函數 ---
        function drawMathGraphics() {
            timeStep += 0.03;

            ctx.save();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = isIntensityMode ? 'rgba(0, 243, 255, 0.4)' : 'rgba(0, 243, 255, 0.15)';
            ctx.shadowBlur = isIntensityMode ? 10 : 0;
            ctx.shadowColor = '#00f3ff';

            // 頂部正弦波
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 5) {
                let y = Math.sin(x * 0.01 + timeStep) * 20 + Math.cos(x * 0.02 - timeStep) * 10 + 60;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 底部傅立葉疊加方波近似
            ctx.strokeStyle = isIntensityMode ? 'rgba(255, 0, 127, 0.4)' : 'rgba(255, 0, 127, 0.15)';
            ctx.shadowColor = '#ff007f';
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 5) {
                let y = (Math.sin(x * 0.015 + timeStep) +
                         (1/3) * Math.sin(3 * (x * 0.015 + timeStep)) +
                         (1/5) * Math.sin(5 * (x * 0.015 + timeStep))) * 25 + (canvas.height - 70);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // 背景極座標玫瑰線（Polar Rose）
            let centerX = canvas.width * 0.85;
            let centerY = canvas.height * 0.25;
            if (canvas.width < 500) {
                centerX = canvas.width * 0.8;
                centerY = 120;
            }

            ctx.strokeStyle = isIntensityMode ? 'rgba(0, 243, 255, 0.3)' : 'rgba(0, 243, 255, 0.12)';
            ctx.beginPath();
            let k = 4;
            for (let a = 0; a < Math.PI * 2; a += 0.02) {
                let r = 40 * Math.cos(k * a + timeStep * 0.5);
                let px = centerX + r * Math.cos(a);
                let py = centerY + r * Math.sin(a);
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // 即時動態數據 HUD 顯示
            ctx.fillStyle = isIntensityMode ? '#00f3ff' : 'rgba(0, 243, 255, 0.4)';
            ctx.font = '10px monospace';
            ctx.fillText(`f(t) = A·sin(ωt + φ)`, 15, 30);
            ctx.fillText(`F(ω) = ∫ f(t)e^(-iωt) dt`, 15, 45);
            ctx.fillText(`PHASE: ${(timeStep % (Math.PI * 2)).toFixed(2)} rad`, 15, 60);

            ctx.restore();
        }

        function drawEffects() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawMathGraphics();

            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                if (Math.random() > 0.88) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = isIntensityMode ? '#00f3ff' : '#003344';
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            if (isIntensityMode) {
                for (let i = bolts.length - 1; i >= 0; i--) {
                    bolts[i].draw();
                    bolts[i].update();
                    if (bolts[i].life <= 0) bolts.splice(i, 1);
                }

                if (Math.random() < 0.7) {
                    bolts.push(new Lightning());
                }
            }

            requestAnimationFrame(drawEffects);
        }

        class Lightning {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.path = [{x: this.x, y: this.y}];
                this.life = 8;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#ff007f';
                this.generatePath();
            }

            generatePath() {
                let curX = this.x;
                let curY = this.y;
                while (curY < canvas.height) {
                    curX += (Math.random() - 0.5) * 50;
                    curY += Math.random() * 30 + 10;
                    this.path.push({x: curX, y: curY});
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = Math.random() * 2.5 + 1;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;

                for (let i = 0; i < this.path.length - 1; i++) {
                    ctx.moveTo(this.path[i].x, this.path[i].y);
                    ctx.lineTo(this.path[i+1].x, this.path[i+1].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            update() {
                this.life--;
            }
        }

        drawEffects();

        // --- 中英文語系資料 ---
        const messages = {
            zh: {
                title: "&lt; 桃李芬芳．尊師重道 /&gt;",
                text: "親愛的老師：\n\n「程門立雪」感念師恩，「春風化雨」潤物無聲。每當學習遇到瓶頸，總有您「諄諄教誨」，令人「醍醐灌頂」。\n\n感謝您如穩定的電源與核心邏輯，帶領我們電子科二年乙班在電路、程式與人生的雜訊中除錯，走向清晰與成長。\n\n祝您教師節快樂！桃李滿天下，事事順心、喜樂安康！✨",
                signature: "電子科二年乙班<br>學生 張永旭 敬上 💻"
            },
            en: {
                title: "&lt; Happy Teachers' Day /&gt;",
                text: "Dear Teacher,\n\nYour wisdom lights our path like a steady voltage source, guiding Class 2-B through complex logic and learning challenges with patience and clarity.\n\nThank you for your tireless dedication to Electronics class and for inspiring us to keep upgrading our skills and character.\n\nWishing you a joyful Teachers' Day, great health, and happiness every day! ✨",
                signature: "Class 2-B, Department of Electronics<br>Student Yong-Xu Zhang 💻"
            }
        };

        let currentLang = 'zh';
        let typewriterTimeout;

        function typeWriter(text, elementId, speed = 35) {
            clearTimeout(typewriterTimeout);
            let i = 0;
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';

            function type() {
                if (i < text.length) {
                    const char = text.charAt(i);
                    elem.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    typewriterTimeout = setTimeout(type, speed);
                }
            }
            type();
        }

        // 切換中英文
        function switchLanguage(lang) {
            if (currentLang === lang) return;
            currentLang = lang;

            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            document.getElementById('cardTitle').innerHTML = messages[lang].title;
            document.getElementById('signatureText').innerHTML = messages[lang].signature;

            typeWriter(messages[lang].text, 'typewriter', 30);
        }

        // 啟動體驗
        function startExperience() {
            const intro = document.getElementById('intro');
            const flash = document.getElementById('flash');
            const cardContainer = document.getElementById('cardContainer');

            intro.classList.add('hidden');

            isIntensityMode = true;
            document.body.classList.add('shake');

            setTimeout(() => {
                flash.classList.add('flash-active');
            }, 250);

            setTimeout(() => {
                flash.classList.remove('flash-active');
            }, 450);

            setTimeout(() => {
                document.body.classList.remove('shake');
                cardContainer.classList.add('visible');
                typeWriter(messages[currentLang].text, 'typewriter', 35);
            }, 750);
        }
    </script>
</body>
</html>
